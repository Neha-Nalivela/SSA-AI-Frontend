{% extends "faculty_base.html" %}

{% block title %}
Edit Question
{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">
        Edit Question
    </h2>

    <form
        method="POST"
        action="/faculty/question-bank/update/{{ question.QuestionID }}">

        <div class="card shadow-sm">

            <div class="card-body">

                <div class="mb-3">

                    <label class="form-label">

                        Question ID

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ question.QuestionID }}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Subject

                    </label>

                    <input
                        type="text"
                        name="Subject"
                        class="form-control"
                        value="{{ question.Subject }}">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Question

                    </label>

                    <textarea
                        name="Question"
                        class="form-control"
                        rows="5">{{ question.Question }}</textarea>

                </div>

                <button
                    class="btn btn-success">

                    Update Question

                </button>

                <a
                    href="/faculty/question-bank"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </div>

    </form>

</div>

{% endblock %}
